    /* ================= Linear GraphQL Operations ================= */
    let lastSyncAt = 0;

    async function loadData() {
      if (!getApiKey()) {
        setSyncStatus("待連結金鑰");
        document.getElementById("crumb-name").textContent = "生活管理";
        openAuthModal(false);
        return;
      }
      setSyncStatus("同步中...");
      try {
        const data = await gql(`
          query LoadWorkspace($teamId: String!) {
            viewer { id name }
            projects(first: 50) {
              nodes { id name color description sortOrder state trashed archivedAt createdAt updatedAt }
            }
            issueLabels(first: 150) {
              nodes { id name color description isGroup archivedAt }
            }
            issues(first: 250) {
              nodes {
                id
                title
                description
                priority
                createdAt
                updatedAt
                completedAt
                state { id name type }
                project { id name }
                labels {
                  nodes { id name color description }
                }
                comments {
                  nodes { id body createdAt updatedAt }
                }
              }
            }
            team(id: $teamId) {
              states {
                nodes { id name type position }
              }
            }
          }
        `, { teamId: getTeamId() });

        state.viewerId = data.viewer.id;
        state.viewerName = (data.viewer.name || "Y").trim().charAt(0).toUpperCase();
        state.projects = sortProjectsBySavedOrder(
          data.projects.nodes
            .filter(p => !p.trashed && !p.archivedAt && p.state !== "canceled" && p.state !== "completed")
        );

        const projectNames = new Set(state.projects.map(p => p.name));
        const allLabels = (data.issueLabels?.nodes || []).filter(l => !l.archivedAt && !l.isGroup);
        const typeLabelsByKey = {};
        for (const l of allLabels) {
          const tKey = getLabelTypeKey(l);
          if (tKey) typeLabelsByKey[tKey] = l;
        }
        state.typeLabelsByKey = typeLabelsByKey;
        state.labels = allLabels.filter(
          l => !getLabelTypeKey(l) && (!projectNames.has(l.name) || (l.description || "").startsWith("project:"))
        );

        state.issues = data.issues.nodes.filter(
          i => i.state && i.state.type !== "canceled" && i.state.type !== "duplicate"
        );

        const activeIssueIds = new Set(state.issues.map(i => i.id));
        state.checkedIssueIds = new Set([...state.checkedIssueIds].filter(id => activeIssueIds.has(id)));

        const wf = {};
        for (const s of data.team.states.nodes) {
          if (s.type === "unstarted" && !wf.todo) wf.todo = s;
          if (s.type === "started" && !wf.started) wf.started = s;
          if (s.type === "completed" && !wf.completed) wf.completed = s;
        }
        state.workflowStates = wf;

        const validProject =
          state.selectedProjectId === ALL_PROJECTS_ID ||
          state.projects.some(p => p.id === state.selectedProjectId);
        if (!validProject) {
          state.selectedProjectId = state.projects[0]?.id || ALL_PROJECTS_ID;
        }
        if (localStorage.getItem("expanded_project_ids") === null && state.selectedProjectId && state.selectedProjectId !== ALL_PROJECTS_ID) {
          state.expandedProjectIds.add(state.selectedProjectId);
          saveExpandedProjects();
        }
        if (!state.quickAddProjectId || !state.projects.some(p => p.id === state.quickAddProjectId)) {
          state.quickAddProjectId = state.projects[0]?.id || null;
        }

        if (state.labelFilter && !getScopedLabels().some(l => l.id === state.labelFilter)) {
          state.labelFilter = null;
        }
        state.quickAddLabelIds = state.quickAddLabelIds.filter(id => state.labels.some(l => l.id === id));

        if (state.selectedIssueId && !state.issues.some(i => i.id === state.selectedIssueId)) {
          state.selectedIssueId = null;
        }

        renderAll();
        lastSyncAt = Date.now();
        setSyncStatus("已同步");
      } catch (err) {
        setSyncStatus("離線");
        showToast("載入失敗：" + err.message);
      }
    }

    async function updateIssueBucket(issue, targetBucket) {
      const targetState = getStateForBucket(targetBucket);
      if (!targetState || issue.state.id === targetState.id) return;

      const prevState = issue.state;
      const prevUpdated = issue.updatedAt;
      issue.state = targetState;
      issue.updatedAt = new Date().toISOString();
      renderAll();

      try {
        const res = await gql(`
          mutation UpdateIssueState($id: String!, $stateId: String!) {
            issueUpdate(id: $id, input: { stateId: $stateId }) {
              success
              issue { updatedAt completedAt state { id name type } }
            }
          }
        `, { id: issue.id, stateId: targetState.id });

        if (res.issueUpdate.issue) {
          issue.updatedAt = res.issueUpdate.issue.updatedAt;
          issue.completedAt = res.issueUpdate.issue.completedAt;
          issue.state = res.issueUpdate.issue.state;
          renderAll();
        }
        showToast("已更新狀態");
      } catch (err) {
        issue.state = prevState;
        issue.updatedAt = prevUpdated;
        renderAll();
        showToast("更新狀態失敗：" + err.message);
      }
    }

    async function updateIssuePriority(issue, newPriority) {
      if ((issue.priority || 0) === newPriority) return;
      const prevPriority = issue.priority || 0;
      const prevUpdated = issue.updatedAt;
      issue.priority = newPriority;
      issue.updatedAt = new Date().toISOString();
      renderAll();

      try {
        const res = await gql(`
          mutation UpdateIssuePriority($id: String!, $priority: Int!) {
            issueUpdate(id: $id, input: { priority: $priority }) {

          renderAll();
        }
        showToast("已更新優先級");
      } catch (err) {
        issue.priority = prevPriority;
        issue.updatedAt = prevUpdated;
        renderAll();
        showToast("更新優先級失敗：" + err.message);

    async function updateIssueFields(issue, input, successMsg) {
      const prev = {
        title: issue.title,
        description: issue.description,
        updatedAt: issue.updatedAt
      };
      if ("title" in input) issue.title = input.title;
      if ("description" in input) {
        issue.description = input.description;
        if (state.selectedIssueId === issue.id) state.descDirty = false;
      }
      issue.updatedAt = new Date().toISOString();
      try {
        const res = await gql(`
          mutation UpdateIssueFields($id: String!, $input: IssueUpdateInput!) {
            issueUpdate(id: $id, input: $input) {
              success
              issue {
                title
                description
                priority
                updatedAt
                project { id name }
              }
            }
          }
        `, { id: issue.id, input });

        if (res.issueUpdate.issue) {
          issue.title = res.issueUpdate.issue.title;
          issue.description = res.issueUpdate.issue.description;
          issue.priority = res.issueUpdate.issue.priority;
          issue.updatedAt = res.issueUpdate.issue.updatedAt;
          issue.project = res.issueUpdate.issue.project;
          if (state.selectedIssueId === issue.id && "description" in input) {
            state.descDirty = false;
          }
          renderAll();
          if (successMsg) showToast(successMsg);
        }
      } catch (err) {
        issue.title = prev.title;
        issue.description = prev.description;
        issue.updatedAt = prev.updatedAt;
        if (state.selectedIssueId === issue.id && "description" in input) {
          state.descDirty = true;
        }
        renderAll();
        showToast("儲存失敗：" + err.message);
      }
    }

    function flushDetailEdits() {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      if (!issue) return;
      const nextTitle = document.getElementById("detail-title-input").value.trim();
      const nextDesc = document.getElementById("detail-desc-input").value;
      const input = {};
      if (nextTitle && nextTitle !== issue.title) input.title = nextTitle;
      if (state.descDirty && nextDesc !== (issue.description || "")) input.description = nextDesc;
      state.descDirty = false;
      if (Object.keys(input).length > 0) {
        updateIssueFields(issue, input, "已自動儲存變更");
      }
    }

    async function createLabel(name, color, projectId) {
      const trimmed = name.trim();
      if (!trimmed) return null;
      const existing = state.labels.find(l => l.name.trim().toLowerCase() === trimmed.toLowerCase());
      if (existing) {
        showToast(`已有標籤「${existing.name}」`);
        return existing;
      }

      const description = projectId && projectId !== ALL_PROJECTS_ID ? `project:${projectId}` : undefined;
      try {
        const res = await gql(`
          mutation CreateIssueLabel($input: IssueLabelCreateInput!) {
            issueLabelCreate(input: $input) {
              success
              issueLabel { id name color description isGroup archivedAt }
            }
          }
        `, {
          input: {
            teamId: getTeamId(),
            name: trimmed,
            color,
            ...(description ? { description } : {})
          }
        });

        if (res.issueLabelCreate.success && res.issueLabelCreate.issueLabel) {
          state.labels.push(res.issueLabelCreate.issueLabel);

        desc: "此標籤將從 Linear 移除。"

              i.labels.nodes = i.labels.nodes.filter(l => l.id !== label.id);
            }
          });

          state.quickAddLabelIds = state.quickAddLabelIds.filter(id => id !== label.id);

      } catch (err) {

      }

    async function toggleIssueLabel(issue, label) {
      const currentNodes = [...(issue.labels?.nodes || [])];
      const prevUpdated = issue.updatedAt;
      const visibleIds = new Set(getIssueLabels(issue).map(l => l.id));
      const hiddenIds = currentNodes.map(l => l.id).filter(id => !state.labels.some(sl => sl.id === id));

      if (visibleIds.has(label.id)) {
        visibleIds.delete(label.id);
      } else {
        visibleIds.add(label.id);
      }

      const nextLabelIds = [...hiddenIds, ...visibleIds];
      const nextNodes = [
        ...currentNodes.filter(l => hiddenIds.includes(l.id)),
        ...Array.from(visibleIds).map(id => state.labels.find(sl => sl.id === id)).filter(Boolean)
      ];

      issue.labels = { nodes: nextNodes };
      issue.updatedAt = new Date().toISOString();
      renderAll();

      try {
        const res = await gql(`
          mutation UpdateIssueLabels($id: String!, $labelIds: [String!]!) {
            issueUpdate(id: $id, input: { labelIds: $labelIds }) {
              success
              issue {
                updatedAt
                labels { nodes { id name color description } }
              }
            }
          }
        `, { id: issue.id, labelIds: nextLabelIds });

        if (res.issueUpdate.issue) {
          issue.updatedAt = res.issueUpdate.issue.updatedAt;
          issue.labels = res.issueUpdate.issue.labels;
          renderAll();
        }
      } catch (err) {
        issue.labels = { nodes: currentNodes };
        issue.updatedAt = prevUpdated;
        renderAll();
        showToast("更新標籤失敗：" + err.message);
      }
    }

    async function ensureTypeLabelId(typeKey) {
      if (state.typeLabelsByKey[typeKey]?.id) return state.typeLabelsByKey[typeKey].id;
      const meta = getTypeMeta(typeKey);
      try {
        const res = await gql(`
          mutation CreateTypeLabel($input: IssueLabelCreateInput!) {
            issueLabelCreate(input: $input) {
              success
              issueLabel { id name color description isGroup archivedAt }
            }
          }
        `, {
          input: {
            teamId: getTeamId(),
            name: `Type: ${meta.label}`,
            color: meta.color,
            description: `type:${meta.value}`
          }
        });
        if (res.issueLabelCreate.success && res.issueLabelCreate.issueLabel) {
          state.typeLabelsByKey[meta.value] = res.issueLabelCreate.issueLabel;
          return res.issueLabelCreate.issueLabel.id;
        }
      } catch (err) {
        showToast("同步 Type 標籤失敗：" + err.message);
      }
      return null;
    }

    async function updateIssueType(issue, newTypeKey) {
      if (getIssueType(issue) === newTypeKey) return;
      const prevNodes = [...(issue.labels?.nodes || [])];
      const prevUpdated = issue.updatedAt;
      const typeIds = new Set(Object.values(state.typeLabelsByKey).map(l => l.id));
      const nonTypeNodes = prevNodes.filter(l => !typeIds.has(l.id) && !getLabelTypeKey(l));

      const targetTypeId = await ensureTypeLabelId(newTypeKey);
      if (!targetTypeId) return;
      const targetTypeObj = state.typeLabelsByKey[newTypeKey];

      issue.labels = { nodes: [...nonTypeNodes, targetTypeObj] };
      issue.updatedAt = new Date().toISOString();
      renderAll();

      const nextLabelIds = [...nonTypeNodes.map(l => l.id), targetTypeId];
      try {
        const res = await gql(`
          mutation UpdateIssueType($id: String!, $labelIds: [String!]!) {
            issueUpdate(id: $id, input: { labelIds: $labelIds }) {
              success
              issue {
                updatedAt
                labels { nodes { id name color description } }
              }
            }
          }
        `, { id: issue.id, labelIds: nextLabelIds });

        if (res.issueUpdate.issue) {
          issue.updatedAt = res.issueUpdate.issue.updatedAt;
          issue.labels = res.issueUpdate.issue.labels;
          renderAll();
        }
        showToast(`已設為 ${getTypeMeta(newTypeKey).label}`);
      } catch (err) {
        issue.labels = { nodes: prevNodes };
        issue.updatedAt = prevUpdated;
        renderAll();
        showToast("更新 Type 失敗：" + err.message);
      }
    }

    async function createIssue(title, priorityOverride = null) {
      const trimmed = title.trim();
      if (!trimmed || !state.workflowStates.todo) return;

      const targetProjectId =
        state.selectedProjectId === ALL_PROJECTS_ID
          ? (state.quickAddProjectId || state.projects[0]?.id)
          : state.selectedProjectId;
      if (!targetProjectId) return;

      const priority = priorityOverride !== null ? priorityOverride : state.quickAddPriority;
      const labelIds = state.quickAddLabelIds.length
        ? [...state.quickAddLabelIds]
        : (state.labelFilter && getScopedLabels(targetProjectId).some(l => l.id === state.labelFilter)
            ? [state.labelFilter]
            : []);

      const activeTypeKey = state.quickAddType || (state.typeFilter !== "all" ? state.typeFilter : "task");
      const typeLabelId = await ensureTypeLabelId(activeTypeKey);
      if (typeLabelId && !labelIds.includes(typeLabelId)) {
        labelIds.push(typeLabelId);
      }

      try {
        const res = await gql(`
          mutation CreateIssue($input: IssueCreateInput!) {
            issueCreate(input: $input) {
              success
              issue {
                id
                title
                description
                priority
                createdAt
                updatedAt
                completedAt
                state { id name type }
                project { id name }
                labels { nodes { id name color description } }
                comments { nodes { id body createdAt updatedAt } }
              }
            }
          }
        `, {
          input: {
            teamId: getTeamId(),
            projectId: targetProjectId,
            title: trimmed,
            priority,
            ...(labelIds.length ? { labelIds } : {}),
            stateId: state.workflowStates.todo.id,
            assigneeId: state.viewerId
          }
        });

        if (res.issueCreate.success && res.issueCreate.issue) {
          state.issues.unshift(res.issueCreate.issue);
          const inputEl = document.getElementById("new-task-input");
          inputEl.value = "";
          if (isMobileViewport()) {
            inputEl.blur();
            setComposerExpanded(false);
          }
          state.quickAddPriority = 0;
          state.quickAddLabelIds = [];
          state.quickAddType = state.typeFilter !== "all" ? state.typeFilter : "task";
          renderAll();
          showToast("已建立項目");
        }
      } catch (err) {
        showToast("建立失敗：" + err.message);
      }
    }

    async function runBatchDelete(ids, gqlQuery) {
      const results = await Promise.allSettled(
        ids.map(id => gql(gqlQuery, { id }))
      );
      const deletedIds = new Set();
      let failedCount = 0;
      results.forEach((res, idx) => {
        const payload = res.status === "fulfilled" ? Object.values(res.value || {})[0] : null;
        if (res.status === "fulfilled" && payload?.success !== false) {
          deletedIds.add(ids[idx]);
        } else {
          failedCount++;
        }
      });
      return { deletedIds, failedCount };
    }

    async function deleteIssue(issue) {
      const ok = await askConfirm({
        title: "確定要刪除這筆項目嗎？",
        desc: `即將從 Linear 永久移除「${issue.title}」。`
      });
      if (!ok) return;
      try {
        const res = await gql(`
          mutation DeleteIssue($id: String!) {
            issueDelete(id: $id) { success }
          }
        `, { id: issue.id });

        if (res.issueDelete.success) {
          state.issues = state.issues.filter(i => i.id !== issue.id);
          state.checkedIssueIds.delete(issue.id);
          if (state.selectedIssueId === issue.id) state.selectedIssueId = null;
          renderAll();
          showToast("已刪除");
        }
      } catch (err) {
        showToast("刪除失敗：" + err.message);
      }
    }

    async function deleteCheckedIssues() {
      const targetIds = getFilteredAndSortedIssues()
        .map(i => i.id)
        .filter(id => state.checkedIssueIds.has(id));
      if (!targetIds.length) return;

      const ok = await askConfirm({
        title: `確定要刪除這 ${targetIds.length} 個項目嗎？`,
        desc: "所選項目與其討論串筆記都將從 Linear 移除。",
        confirmText: `刪除 ${targetIds.length} 筆`
      });
      if (!ok) return;

      const btn = document.getElementById("batch-delete-btn");
      btn.disabled = true;
      setSyncStatus("刪除中...");
      try {
        const { deletedIds, failedCount } = await runBatchDelete(targetIds, `
          mutation DeleteIssue($id: String!) {
            issueDelete(id: $id) { success }
          }
        `);
        state.issues = state.issues.filter(i => !deletedIds.has(i.id));
        deletedIds.forEach(id => state.checkedIssueIds.delete(id));
        if (state.checkedIssueIds.size === 0) state.selectMode = false;
        if (deletedIds.has(state.selectedIssueId)) state.selectedIssueId = null;
        renderAll();
        lastSyncAt = Date.now();
        setSyncStatus("已同步");
        showToast(failedCount ? `已刪除 ${deletedIds.size} 筆，${failedCount} 筆失敗` : `已刪除 ${deletedIds.size} 個項目`);
      } finally {
        btn.disabled = false;
      }
    }

    async function addComment(issue, body) {
      const trimmed = body.trim();
      if (!trimmed) return;
      const btn = document.getElementById("add-comment-btn");
      btn.disabled = true;
      try {
        const res = await gql(`
          mutation CreateComment($input: CommentCreateInput!) {
            commentCreate(input: $input) {
              success
              comment { id body createdAt updatedAt }
            }
          }
        `, { input: { issueId: issue.id, body: trimmed } });

        if (res.commentCreate.success && res.commentCreate.comment) {

          issue.comments.nodes.push(res.commentCreate.comment);
          issue.updatedAt = res.commentCreate.comment.createdAt;
          document.getElementById("new-comment-input").value = "";
          renderAll();
          showToast("已新增筆記");
        }
      } catch (err) {
        showToast("新增筆記失敗：" + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function updateComment(issue, comment, newBody) {
      const trimmed = newBody.trim();
      if (!trimmed) return;
      try {
        const res = await gql(`
          mutation UpdateComment($id: String!, $input: CommentUpdateInput!) {
            commentUpdate(id: $id, input: $input) {
              success
              comment { id body createdAt updatedAt }
            }
          }
        `, { id: comment.id, input: { body: trimmed } });

        if (res.commentUpdate.success && res.commentUpdate.comment) {
          comment.body = res.commentUpdate.comment.body;
          comment.updatedAt = res.commentUpdate.comment.updatedAt;
          issue.updatedAt = res.commentUpdate.comment.updatedAt;
          state.editingCommentId = null;
          renderAll();

    async function deleteComment(issue, comment) {

        desc: comment.body ? `「${comment.body.slice(0, 60)}${comment.body.length > 60 ? "..." : ""}」` : "此動作無法復原。"
      });
      if (!ok) return;
      try {
        const res = await gql(`
          mutation DeleteComment($id: String!) {
            commentDelete(id: $id) { success }
          }
        `, { id: comment.id });

        if (res.commentDelete.success) {
          issue.comments.nodes = issue.comments.nodes.filter(c => c.id !== comment.id);
          renderAll();
          showToast("已刪除筆記");

    async function deleteProject(project) {
      const ok = await askConfirm({
        title: `確定要刪除「${project.name}」專案嗎？`,
        desc: "此專案將從 Linear 移除。"
      });
      if (!ok) return;

      setSyncStatus("刪除專案中...");
      try {
        const res = await gql(`
          mutation DeleteProject($id: String!) {
            projectDelete(id: $id) { success }
          }
        `, { id: project.id });

        if (res.projectDelete.success) {
          state.projects = state.projects.filter(p => p.id !== project.id);
          state.issues.forEach(i => {
            if (i.project?.id === project.id) i.project = null;
          });
          if (state.selectedProjectId === project.id) {
            state.selectedProjectId = state.projects[0]?.id || ALL_PROJECTS_ID;
            localStorage.setItem("selected_project_id", state.selectedProjectId);
          }
          if (state.quickAddProjectId === project.id) {
            state.quickAddProjectId = state.projects[0]?.id || null;
          }
          if (state.labelFilter && !getScopedLabels().some(l => l.id === state.labelFilter)) {
            state.labelFilter = null;
          }
          state.expandedProjectIds.delete(project.id);
          saveExpandedProjects();
          localStorage.setItem("project_order", JSON.stringify(state.projects.map(p => p.id)));
          renderAll();
          setSyncStatus("已同步");
          showToast(`已刪除專案「${project.name}」`);
        }
      } catch (err) {
        setSyncStatus("已同步");
        showToast("刪除專案失敗：" + err.message);
      }
    }

    async function reorderProjects(draggedId, targetId, insertAfter) {
      const prevOrder = state.projects.map(p => p.id).join(",");
      const fromIdx = state.projects.findIndex(p => p.id === draggedId);
      if (fromIdx < 0) return;
      const [moved] = state.projects.splice(fromIdx, 1);
      let toIdx = state.projects.findIndex(p => p.id === targetId);
      if (toIdx < 0) {
        state.projects.splice(fromIdx, 0, moved);
        return;
      }
      if (insertAfter) toIdx += 1;
      state.projects.splice(toIdx, 0, moved);

      const newOrder = state.projects.map(p => p.id);
      if (prevOrder === newOrder.join(",")) return;

      localStorage.setItem("project_order", JSON.stringify(newOrder));
      state.projects.forEach((p, idx) => {
        p.sortOrder = (state.projects.length - idx) * 100;
      });
      renderAll();
      showToast("已調整分類順序");

      setSyncStatus("同步排序中...");
      try {
        await Promise.allSettled(
          state.projects.map(p =>
            gql(`
              mutation ReorderProject($id: String!, $sortOrder: Float!) {
                projectUpdate(id: $id, input: { sortOrder: $sortOrder }) { success }
              }
            `, { id: p.id, sortOrder: p.sortOrder })
          )
        );
        setSyncStatus("已同步");
      } catch {
        setSyncStatus("已同步");
      }
    }

    async function createProject(name, desc) {
      const trimmed = name.trim();
      if (!trimmed) return;
      const color = PROJECT_COLORS[state.projects.length % PROJECT_COLORS.length];
      try {
        const res = await gql(`
          mutation CreateProject($input: ProjectCreateInput!) {
            projectCreate(input: $input) {
              success
              project { id name color description sortOrder state createdAt updatedAt }
            }
          }
        `, {
          input: {
            name: trimmed,
            description: desc.trim() || undefined,
            teamIds: [getTeamId()],
            color
          }
        });

        if (res.projectCreate.success && res.projectCreate.project) {
          state.projects.push(res.projectCreate.project);
          state.selectedProjectId = res.projectCreate.project.id;
          state.expandedProjectIds.add(res.projectCreate.project.id);
          saveExpandedProjects();
          localStorage.setItem("project_order", JSON.stringify(state.projects.map(p => p.id)));
          localStorage.setItem("selected_project_id", state.selectedProjectId);
          document.getElementById("new-project-name").value = "";
          document.getElementById("new-project-desc").value = "";
          document.getElementById("new-project-form").classList.remove("open");
          renderAll();
          showToast(`已建立專案「${trimmed}」`);
        }
      } catch (err) {
        showToast("建立專案失敗：" + err.message);
      }
    }

    /* ================= Data Filtering & Sorting ================= */
    function getScopedIssues(applyLabel = true) {
      const q = state.searchQuery.trim().toLowerCase();
      return state.issues.filter(issue => {
        if (state.selectedProjectId !== ALL_PROJECTS_ID) {
          if (!issue.project || issue.project.id !== state.selectedProjectId) return false;
        }
        if (state.typeFilter !== "all" && getIssueType(issue) !== state.typeFilter) return false;
        if (q) {
          const inTitle = (issue.title || "").toLowerCase().includes(q);
          const inDesc = (issue.description || "").toLowerCase().includes(q);
          const inNotes = (issue.comments?.nodes || []).some(c => (c.body || "").toLowerCase().includes(q));
          const inLabels = getIssueLabels(issue).some(l => l.name.toLowerCase().includes(q));
          const inType = getTypeMeta(getIssueType(issue)).label.toLowerCase().includes(q);
          if (!inTitle && !inDesc && !inNotes && !inLabels && !inType) return false;
        }
        if (applyLabel && state.labelFilter) {
          if (!getIssueLabels(issue).some(l => l.id === state.labelFilter)) return false;
        }
        return true;
      });
    }

    function getFilteredAndSortedIssues() {
      const scoped = getScopedIssues();
      const list = scoped.filter(issue => {
        const bucket = getBucket(issue);
        if (state.statusFilter === "active" && bucket === "closed") return false;
        if (state.statusFilter === "open" && bucket !== "open") return false;
        if (state.statusFilter === "progress" && bucket !== "progress") return false;
        if (state.statusFilter === "closed" && bucket !== "closed") return false;
        return true;
      });

      list.sort((a, b) => {
        const ca = new Date(a.createdAt).getTime();
        const cb = new Date(b.createdAt).getTime();
        const ua = new Date(a.updatedAt).getTime();
        const ub = new Date(b.updatedAt).getTime();
        if (state.sortBy === "priority_desc") {
          const pa = (a.priority || 0) === 0 ? 99 : a.priority;
          const pb = (b.priority || 0) === 0 ? 99 : b.priority;
          return pa - pb || ub - ua;
        }
        if (state.sortBy === "priority_asc") {
          const pa = (a.priority || 0) === 0 ? -1 : a.priority;
          const pb = (b.priority || 0) === 0 ? -1 : b.priority;
          return pb - pa || ub - ua;
        }
        if (state.sortBy === "type_asc") {
          const ta = getTypeMeta(getIssueType(a)).order;
          const tb = getTypeMeta(getIssueType(b)).order;
          return ta - tb || ub - ua;
        }
        if (state.sortBy === "type_desc") {
          const ta = getTypeMeta(getIssueType(a)).order;
          const tb = getTypeMeta(getIssueType(b)).order;
          return tb - ta || ub - ua;
        }
        if (state.sortBy === "updated_desc") return ub - ua;
        if (state.sortBy === "updated_asc") return ua - ub;
        if (state.sortBy === "created_desc") return cb - ca;
        return ca - cb;
      });
      return list;
    }

          state.selectedProjectId = project.id;
          state.checkedIssueIds.clear();
          state.selectMode = false;
          state.quickAddLabelIds = [];
          localStorage.setItem("selected_project_id", project.id);

          if (isMobileViewport()) {
            state.labelFilter = null;
            state.expandedProjectIds.add(project.id);
            saveExpandedProjects();
            closeMobileSidebar();
            renderAll();
            return;
          }

          if (!isSame || state.labelFilter !== null) {
            state.labelFilter = null;
            state.expandedProjectIds.add(project.id);
          } else if (state.expandedProjectIds.has(project.id)) {
            state.expandedProjectIds.delete(project.id);
          } else {
            state.expandedProjectIds.add(project.id);
          }
          saveExpandedProjects();
          renderAll();

        btn.addEventListener("dragstart", e => {
          state.draggedProjectId = project.id;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", project.id);
          requestAnimationFrame(() => group.classList.add("dragging"));

        btn.addEventListener("dragend", () => {
          state.draggedProjectId = null;
          clearDragMarks();
        });

        group.addEventListener("dragover", e => {
          if (!state.draggedProjectId || state.draggedProjectId === project.id) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const rect = btn.getBoundingClientRect();
          const insertAfter = e.clientY > rect.top + rect.height / 2;
          listEl.querySelectorAll(".nav-project-group").forEach(el => {
            if (el !== group) el.classList.remove("drag-over-top", "drag-over-bottom");

            group.classList.remove("drag-over-top", "drag-over-bottom");

        group.addEventListener("drop", e => {
          e.preventDefault();
          e.stopPropagation();
          const draggedId = state.draggedProjectId;
          state.draggedProjectId = null;
          const rect = btn.getBoundingClientRect();
          const insertAfter = e.clientY > rect.top + rect.height / 2;
          clearDragMarks();
          if (draggedId && draggedId !== project.id) {
            reorderProjects(draggedId, project.id, insertAfter);

            subDot.style.background = lbl.color || "#4EA7FC";

            const subCount = document.createElement("span");
            subCount.className = "nav-count";
            subCount.textContent = openLblCount > 0 ? String(openLblCount) : "";
            if (!openLblCount) subCount.style.display = "none";

            const subDelBtn = createTrashBtn(`刪除標籤 ${lbl.name}`, () => deleteLabel(lbl));

            subBtn.append(subDot, subName, subCount, subDelBtn);
            subBtn.addEventListener("click", () => {
              state.selectedProjectId = project.id;
              state.labelFilter = lbl.id;
              state.checkedIssueIds.clear();
              state.selectMode = false;
              state.quickAddLabelIds = [];
              state.expandedProjectIds.add(project.id);
              saveExpandedProjects();
              localStorage.setItem("selected_project_id", project.id);
              closeMobileSidebar();
              renderAll();

            sublist.appendChild(subBtn);
          }

          const subAddBtn = document.createElement("button");
          subAddBtn.type = "button";
          subAddBtn.className = "nav-subitem nav-subadd";
          subAddBtn.innerHTML = `<span style="width:7px; text-align:center;">+</span><span>新增標籤</span>`;
