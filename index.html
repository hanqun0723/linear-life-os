      });
      document.querySelectorAll("#filter-tabs .view-tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.filter === state.statusFilter);
      });

      const typeFilterBtn = document.getElementById("type-filter-btn");
      typeFilterBtn.classList.toggle("active", state.typeFilter !== "all");
      typeFilterBtn.innerHTML = "";
      if (state.typeFilter === "all") {
        const lbl = document.createElement("span");
        lbl.id = "type-filter-label";
        lbl.textContent = "類型";
        typeFilterBtn.appendChild(lbl);
      } else {
        const tfMeta = getTypeMeta(state.typeFilter);
        const iconSpan = document.createElement("span");
        iconSpan.style.cssText = `display:inline-flex; align-items:center; color:${tfMeta.color};`;
        iconSpan.innerHTML = makeTypeSvg(tfMeta.svg, 13);
        const lbl = document.createElement("span");
        lbl.id = "type-filter-label";
        lbl.textContent = tfMeta.label;
        typeFilterBtn.append(iconSpan, lbl);
      }

      const currentSort = SORT_ITEMS.find(s => s.value === state.sortBy);
      const isMob = window.matchMedia("(max-width: 768px)").matches;
      document.getElementById("sort-menu-label").textContent = currentSort
        ? (isMob ? currentSort.shortLabel : currentSort.label)
        : "排序";

      const taskInputEl = document.getElementById("new-task-input");
      if (isMob) {
        const activeProj = state.selectedProjectId === ALL_PROJECTS_ID
          ? (state.projects.find(p => p.id === state.quickAddProjectId) || state.projects[0])
          : state.projects.find(p => p.id === state.selectedProjectId);
        taskInputEl.placeholder = activeProj
          ? `+ 新增項目到「${activeProj.name}」...`
          : "+ 新增項目或想法...";
      } else {
        taskInputEl.placeholder = "今天想記錄或安排什麼？輸入標題按 Enter 直接同步...";
      }

      const commentInputEl = document.getElementById("new-comment-input");
      if (commentInputEl) {
        commentInputEl.placeholder = isMob
          ? "記下新筆記或進度..."
          : "在討論串記下新筆記... (Cmd / Ctrl + Enter 送出)";
      }

      renderLabelBar();
    }

    function renderLabelBar() {
      const bar = document.getElementById("label-bar");
      bar.innerHTML = "";

      const baseIssues = getScopedIssues(false);
      const scopedLabels = getScopedLabels();
      bar.classList.toggle("empty-labels", scopedLabels.length === 0);
      if (state.labelFilter && !scopedLabels.some(l => l.id === state.labelFilter)) {
        state.labelFilter = null;
      }

      const allWrap = document.createElement("span");
      allWrap.className = "label-filter-wrap" + (!state.labelFilter ? " active" : "");
      const allPill = document.createElement("button");
      allPill.type = "button";
      allPill.className = "label-filter-pill";
      allPill.textContent = "全部標籤";
      const allCnt = document.createElement("span");
      allCnt.className = "label-filter-count";
      allCnt.textContent = String(baseIssues.length);
      allPill.appendChild(allCnt);
      allPill.addEventListener("click", () => {
        if (!state.labelFilter) return;
        state.labelFilter = null;
        renderAll();
      });
      allWrap.appendChild(allPill);
      bar.appendChild(allWrap);

      for (const label of scopedLabels) {
        const cnt = baseIssues.filter(i => (i.labels?.nodes || []).some(l => l.id === label.id)).length;
        const wrap = document.createElement("span");
        wrap.className = "label-filter-wrap" + (state.labelFilter === label.id ? " active" : "");
        wrap.style.setProperty("--label-color", label.color || "#4EA7FC");

        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "label-filter-pill";
        const dot = document.createElement("span");
        dot.className = "label-filter-dot";
        const nameSpan = document.createElement("span");
        nameSpan.textContent = label.name;
        pill.append(dot, nameSpan);
        if (cnt > 0) {
          const cntSpan = document.createElement("span");
          cntSpan.className = "label-filter-count";
          cntSpan.textContent = String(cnt);
          pill.appendChild(cntSpan);
        }
        pill.addEventListener("click", () => {
          state.labelFilter = state.labelFilter === label.id ? null : label.id;
          renderAll();
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "label-filter-del";
        delBtn.title = `刪除標籤 ${label.name}`;
        delBtn.setAttribute("aria-label", `刪除標籤 ${label.name}`);
        delBtn.textContent = "×";
        delBtn.addEventListener("click", e => {
          e.stopPropagation();
          deleteLabel(label);
        });

        wrap.append(pill, delBtn);
        bar.appendChild(wrap);
      }

      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "label-add-pill";
      addBtn.id = "add-label-pill-btn";
      addBtn.textContent = "+ 新增標籤";
      addBtn.addEventListener("click", e => {
        e.stopPropagation();
        openLabelPopover(addBtn, { createOnly: true });
      });
      bar.appendChild(addBtn);
    }

    function updateBatchDeleteButton(items) {
      const delBtn = document.getElementById("batch-delete-btn");
      const selectModeBtn = document.getElementById("select-mode-btn");
      const selectAllBtn = document.getElementById("select-all-btn");
      const grid = document.getElementById("db-grid");

      const checkedCount = items.filter(i => state.checkedIssueIds.has(i.id)).length;
      const allChecked = items.length > 0 && checkedCount === items.length;
      const inSelectMode = state.selectMode || checkedCount > 0;

      grid.classList.toggle("select-mode", inSelectMode);
      document.body.classList.toggle("in-select-mode", inSelectMode);
      selectModeBtn.textContent = state.selectMode ? "完成" : "多選";
      selectModeBtn.classList.toggle("active", state.selectMode);

      if (inSelectMode && items.length > 0) {
        selectAllBtn.style.display = "inline-flex";
        selectAllBtn.textContent = allChecked ? "取消全選" : "全選";
      } else {
        selectAllBtn.style.display = "none";
      }

      if (checkedCount > 0) {
        delBtn.style.display = "inline-flex";
        delBtn.textContent = `刪除已選 (${checkedCount})`;
      } else {
        delBtn.style.display = "none";
      }
    }

    function makeTableHead(text, extraClass = "", sortAsc = null, sortDesc = null) {
      const cell = document.createElement("div");
      cell.className = "db-head-cell " + extraClass;
      const span = document.createElement("span");
      span.textContent = text;
      cell.appendChild(span);

      if (sortAsc && sortDesc) {
        cell.classList.add("sortable");
        if (state.sortBy === sortDesc) {
          cell.classList.add("sorted");
          span.textContent = `${text} ↓`;
        } else if (state.sortBy === sortAsc) {
          cell.classList.add("sorted");
          span.textContent = `${text} ↑`;
        }
        cell.addEventListener("click", () => {
          state.sortBy = state.sortBy === sortDesc ? sortAsc : sortDesc;
          localStorage.setItem("sort_by", state.sortBy);
          renderAll();
        });
      }
      return cell;
    }

    function renderDatabaseTable() {
      const grid = document.getElementById("db-grid");
      grid.innerHTML = "";

      const items = getFilteredAndSortedIssues();
      updateBatchDeleteButton(items);

      // Column headers
      grid.appendChild(makeTableHead("項目"));
      grid.appendChild(makeTableHead("Type", "", "type_asc", "type_desc"));
      grid.appendChild(makeTableHead("Priority", "", "priority_asc", "priority_desc"));
      grid.appendChild(makeTableHead("Status", ""));
      grid.appendChild(makeTableHead("Opened", "align-right", "created_asc", "created_desc"));
      grid.appendChild(makeTableHead("Modified", "align-right", "updated_asc", "updated_desc"));

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-db";
        empty.style.gridColumn = "1 / -1";
        empty.textContent = state.searchQuery
          ? "沒有符合搜尋關鍵字的項目"
          : (state.labelFilter || state.typeFilter !== "all"
              ? "目前篩選條件下還沒有項目，直接在上方輸入即可新增。"
              : "目前還沒有任何項目，直接在上方輸入欄輸入標題即可建立。");
        grid.appendChild(empty);
        return;
      }

      for (const issue of items) {
        const bucket = getBucket(issue);
        const isChecked = state.checkedIssueIds.has(issue.id);
        const row = document.createElement("div");
        row.className =
          "db-row" +
          (issue.id === state.selectedIssueId ? " selected" : "") +
          (isChecked ? " checked" : "") +
          (bucket === "closed" ? " is-closed" : "");

        const toggleRowCheck = () => {
          if (state.checkedIssueIds.has(issue.id)) {
            state.checkedIssueIds.delete(issue.id);
          } else {
            state.checkedIssueIds.add(issue.id);
          }
          renderDatabaseTable();
        };

        const onRowClick = e => {
          if (state.selectMode || e.metaKey || e.ctrlKey) {
            toggleRowCheck();
            return;
          }
          flushDetailEdits();
          if (state.selectedIssueId === issue.id) {
            state.selectedIssueId = null;
          } else {
            state.selectedIssueId = issue.id;
            state.editingCommentId = null;
            state.descDirty = false;
          }
          renderAll();
        };

        // Col 1: Morphing Status Dot + Name + Project Chip + Note Count + Hover Trash
        const nameCell = document.createElement("div");
        nameCell.className = "db-cell name-cell";
        nameCell.addEventListener("click", onRowClick);

        const nameLeft = document.createElement("div");
        nameLeft.className = "name-left";

        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = `row-dot ${bucket}`;
        dot.title = "點選可多選";
        dot.setAttribute("aria-label", `選取 ${issue.title}`);
        dot.innerHTML = `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>`;
        dot.addEventListener("click", e => {
          e.stopPropagation();
          toggleRowCheck();
        });
        nameLeft.appendChild(dot);

        const titleSpan = document.createElement("span");
        titleSpan.className = "ticket-name";
        titleSpan.textContent = issue.title;
        nameLeft.appendChild(titleSpan);

        if (state.selectedProjectId === ALL_PROJECTS_ID && issue.project) {
          const pChip = document.createElement("span");
          pChip.className = "proj-chip";
          pChip.appendChild(createProjectChipContent(issue.project));
          nameLeft.appendChild(pChip);
        }

        for (const label of getIssueLabels(issue)) {
          const lChip = createLabelChip(label, true);
          lChip.title = `編輯標籤：${label.name}`;
          lChip.addEventListener("click", e => {
            e.stopPropagation();
            openLabelPopover(lChip, { issue });
          });
          nameLeft.appendChild(lChip);
        }

        const noteCount = issue.comments?.nodes?.length || 0;
        if (noteCount > 0) {
          const nChip = document.createElement("span");
          nChip.className = "note-chip";
          nChip.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11v7.5h-6l-3.2 2.4V11H2.5z"/></svg><span>${noteCount}</span>`;
          nameLeft.appendChild(nChip);
        }

        const rowActions = document.createElement("div");
        rowActions.className = "row-actions";
        rowActions.appendChild(
          createTagBtn("設定標籤", e => openLabelPopover(e.currentTarget, { issue }))
        );
        rowActions.appendChild(
          createTrashBtn("刪除此項目", () => deleteIssue(issue))
        );

        nameCell.appendChild(nameLeft);
        nameCell.appendChild(rowActions);

        // Col 2: Type Pill
        const issueType = getIssueType(issue);
        const typeCell = document.createElement("div");
        typeCell.className = "db-cell";
        const typePill = createTypePill(issueType, false, true);
        typePill.title = getTypeMeta(issueType).desc;
        typePill.addEventListener("click", e => {
          e.stopPropagation();
          openPopover(
            typePill,
            "設定項目類型 (Type)",
            TYPE_ITEMS.map(t => ({
              value: t.value,
              active: issueType === t.value,
              node: () => createTypePill(t.value, true, false)
            })),
            val => updateIssueType(issue, val)
          );
        });
        typeCell.addEventListener("click", onRowClick);
        typeCell.appendChild(typePill);

        // Col 3: Priority Pill
        const prioVal = issue.priority || 0;
        const prioCell = document.createElement("div");
        prioCell.className = "db-cell" + (prioVal === 0 ? " is-prio-0" : "");
        const prioPill = createPriorityPill(prioVal, true, true);
        prioPill.addEventListener("click", e => {
          e.stopPropagation();
          openPopover(
            prioPill,
            "設定優先級",
            PRIORITY_ITEMS.map(p => ({
              value: p.value,
              active: (issue.priority || 0) === p.value,
              node: () => createPriorityPill(p.value, false, false)
            })),
            val => updateIssuePriority(issue, val)
          );
        });
        prioCell.addEventListener("click", onRowClick);
        prioCell.appendChild(prioPill);

        // Col 3: Status Pill
        const statusCell = document.createElement("div");
        statusCell.className = "db-cell";
        const statusPill = createStatusPill(bucket, true);
        statusPill.addEventListener("click", e => {
          e.stopPropagation();
          openPopover(
            statusPill,
            "切換狀態",
            STATUS_ITEMS.map(s => ({
              value: s.bucket,
              active: bucket === s.bucket,
              node: () => createStatusPill(s.bucket, false)
            })),
            val => updateIssueBucket(issue, val)
          );
        });
        statusCell.addEventListener("click", onRowClick);
        statusCell.appendChild(statusPill);

        // Col 4: Opened
        const openedCell = document.createElement("div");
        openedCell.className = "db-cell time-cell";
        openedCell.textContent = formatDateTime(issue.createdAt);
        openedCell.title = `建立於 ${formatDateTime(issue.createdAt, true)} (${formatRelative(issue.createdAt)})`;
        openedCell.addEventListener("click", onRowClick);

        // Col 5: Modified
        const modifiedCell = document.createElement("div");
        modifiedCell.className = "db-cell time-cell";
        const fullTimeSpan = document.createElement("span");
        fullTimeSpan.className = "time-full";
        fullTimeSpan.textContent = formatDateTime(issue.updatedAt);
        const relTimeSpan = document.createElement("span");
        relTimeSpan.className = "time-rel";
        relTimeSpan.textContent = formatRelative(issue.updatedAt);
        modifiedCell.append(fullTimeSpan, relTimeSpan);
        modifiedCell.title = `最後修改 ${formatDateTime(issue.updatedAt, true)} (${formatRelative(issue.updatedAt)})`;
        modifiedCell.addEventListener("click", onRowClick);

        row.addEventListener("click", e => {
          if (!e.target.closest(".db-cell")) onRowClick(e);
        });

        row.append(nameCell, typeCell, prioCell, statusCell, openedCell, modifiedCell);
        grid.appendChild(row);
      }
    }

    let lastRenderedIssueId = null;

    function renderDetailPane() {
      const pane = document.getElementById("detail-pane");
      const issue = state.issues.find(i => i.id === state.selectedIssueId);

      if (!issue) {
        pane.classList.remove("open");
        document.body.classList.remove("peek-open");
        lastRenderedIssueId = null;
        return;
      }

      const issueChanged = lastRenderedIssueId !== issue.id;
      lastRenderedIssueId = issue.id;

      pane.classList.add("open");
      document.body.classList.add("peek-open");

      if (issueChanged) {
        document.getElementById("new-comment-input").value = "";
        const scrollEl = pane.querySelector(".peek-scroll");
        if (scrollEl) {
          scrollEl.classList.remove("switching");
          void scrollEl.offsetWidth;
          scrollEl.classList.add("switching");
        }
      }

      const titleInput = document.getElementById("detail-title-input");
      if (document.activeElement !== titleInput) {
        titleInput.value = issue.title;
      }

      // Properties Block
      const propsEl = document.getElementById("detail-props");
      propsEl.innerHTML = "";
      const bucket = getBucket(issue);

      const addPropRow = (iconSvg, labelText, valueNode) => {
        const r = document.createElement("div");
        r.className = "prop-row";
        const l = document.createElement("div");
        l.className = "prop-label";
        l.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">${iconSvg}</svg>`;
        const lTxt = document.createElement("span");
        lTxt.textContent = labelText;
        l.appendChild(lTxt);
        const v = document.createElement("div");
        v.className = "prop-value";
        v.appendChild(valueNode);
        r.append(l, v);
        propsEl.appendChild(r);
      };

      // Type Prop
      const curType = getIssueType(issue);
      const tPill = createTypePill(curType, true, true);
      tPill.addEventListener("click", e => {
        e.stopPropagation();
        openPopover(
          tPill,
          "設定項目類型 (Type)",
          TYPE_ITEMS.map(t => ({
            value: t.value,
            active: curType === t.value,
            node: () => createTypePill(t.value, true, false)
          })),
          val => updateIssueType(issue, val)
        );
      });
      addPropRow('<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>', "Type", tPill);

      // Status Prop
      const sPill = createStatusPill(bucket, true);
      sPill.addEventListener("click", e => {
        e.stopPropagation();
        openPopover(
          sPill,
          "切換狀態",
          STATUS_ITEMS.map(s => ({
            value: s.bucket,
            active: bucket === s.bucket,
            node: () => createStatusPill(s.bucket, false)
          })),
          val => updateIssueBucket(issue, val)
        );
      });
      addPropRow('<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/>', "Status", sPill);

      // Priority Prop
      const pPill = createPriorityPill(issue.priority || 0, false, true);
      pPill.addEventListener("click", e => {
        e.stopPropagation();
        openPopover(
          pPill,
          "設定優先級",
          PRIORITY_ITEMS.map(p => ({
            value: p.value,
            active: (issue.priority || 0) === p.value,
            node: () => createPriorityPill(p.value, false, false)
          })),
          val => updateIssuePriority(issue, val)
        );
      });
      addPropRow('<path d="M8.5 2L4 9h4l-.5 5L12 7H8l.5-5z"/>', "Priority", pPill);

      // Project Prop
      const projBtn = document.createElement("button");
      projBtn.type = "button";
      projBtn.className = "tag-pill";
      projBtn.style.cssText = "background: var(--bg-subtle); color: var(--ink-strong); border-radius: 999px;";
      if (issue.project) {
        projBtn.appendChild(createProjectChipContent(issue.project));
      } else {
        projBtn.textContent = "未指定";
      }
      projBtn.addEventListener("click", e => {
        e.stopPropagation();
        openPopover(
          projBtn,
          "移動至專案",
          state.projects.map(p => ({
            value: p.id,
            active: issue.project?.id === p.id,
            node: () => createProjectChipContent(p)
          })),
          val => {
            if (issue.project?.id !== val) {
              updateIssueFields(issue, { projectId: val }, "已移動至專案");
            }
          }
        );
      });
      addPropRow('<path d="M2.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-7.5z"/>', "Project", projBtn);

      // Labels Prop
      const labelsFrag = document.createDocumentFragment();
      for (const label of getIssueLabels(issue)) {
        const chip = createLabelChip(label, true);
        chip.addEventListener("click", e => {
          e.stopPropagation();
          openLabelPopover(chip, { issue });
        });
        labelsFrag.appendChild(chip);
      }
      const addLblBtn = document.createElement("button");
      addLblBtn.type = "button";
      addLblBtn.className = "label-add-pill";
      addLblBtn.textContent = "+ 標籤";
      addLblBtn.addEventListener("click", e => {
        e.stopPropagation();
        openLabelPopover(addLblBtn, { issue });
      });
      labelsFrag.appendChild(addLblBtn);
      addPropRow('<path d="M2.5 8.5V3.5a1 1 0 0 1 1-1h5l5 5-5 5-6-4z"/><circle cx="5.5" cy="5.5" r="0.9" fill="currentColor" stroke="none"/>', "Labels", labelsFrag);

      // Timestamps Props
      const openVal = document.createElement("span");
      openVal.className = "prop-time-val";
      openVal.textContent = `${formatDateTime(issue.createdAt, true)} (${formatRelative(issue.createdAt)})`;
      addPropRow('<circle cx="8" cy="8" r="5.5"/><path d="M8 4.8v3.4l2.2 1.3"/>', "Opened", openVal);

      const modVal = document.createElement("span");
      modVal.className = "prop-time-val";
      modVal.textContent = `${formatDateTime(issue.updatedAt, true)} (${formatRelative(issue.updatedAt)})`;
      addPropRow('<circle cx="8" cy="8" r="5.5"/><path d="M8 4.8v3.4l2.2 1.3"/>', "Modified", modVal);

      if (issue.completedAt) {
        const doneVal = document.createElement("span");
        doneVal.className = "prop-time-val";
        doneVal.textContent = formatDateTime(issue.completedAt, true);
        addPropRow('<path d="M3.5 8.5l3 3 6-6"/>', "Closed", doneVal);
      }

      // Description
      const descInput = document.getElementById("detail-desc-input");
      if (!state.descDirty && document.activeElement !== descInput) {
        descInput.value = issue.description || "";
      }
      document.getElementById("save-desc-btn").style.display = state.descDirty ? "inline-block" : "none";

      // Discussion Thread
      const rawComments = [...(issue.comments?.nodes || [])];
      rawComments.sort((a, b) => {
        const da = new Date(a.createdAt).getTime();
        const db = new Date(b.createdAt).getTime();
        return state.commentSortAsc ? da - db : db - da;
      });

      document.getElementById("thread-title").textContent = `討論串筆記 (${rawComments.length})`;
      document.getElementById("thread-sort-btn").textContent = state.commentSortAsc ? "時間：舊到新" : "時間：新到舊";

      const commentListEl = document.getElementById("comment-list");
      commentListEl.innerHTML = "";

      if (rawComments.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "color: var(--ink-faint); font-size: 13px; padding: 4px 0 8px;";
        empty.textContent = "還沒有筆記，在下方輸入框記下想法或進度。";
        commentListEl.appendChild(empty);
      } else {
        for (const comment of rawComments) {
          const item = document.createElement("div");
          item.className = "comment-item";

          const avatar = document.createElement("div");
          avatar.className = "comment-avatar";
          avatar.textContent = state.viewerName;

          const content = document.createElement("div");
          content.className = "comment-content";

          const meta = document.createElement("div");
          meta.className = "comment-meta";

          const timeEl = document.createElement("span");
          timeEl.className = "comment-time";
          const edited =
            comment.updatedAt &&
            new Date(comment.updatedAt).getTime() - new Date(comment.createdAt).getTime() > 2000;
          timeEl.textContent = formatDateTime(comment.createdAt, true) + (edited ? " (已編輯)" : "");

          const actions = document.createElement("div");
          actions.className = "comment-actions";

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "mini-btn";
          editBtn.textContent = "編輯";
          editBtn.addEventListener("click", () => {
            state.editingCommentId = comment.id;
            renderDetailPane();
          });

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "mini-btn danger";
          delBtn.textContent = "刪除";
          delBtn.addEventListener("click", () => deleteComment(issue, comment));

          actions.append(editBtn, delBtn);
          meta.append(timeEl, actions);
          content.appendChild(meta);

          if (state.editingCommentId === comment.id) {
            const editArea = document.createElement("textarea");
            editArea.className = "notion-textarea";
            editArea.style.cssText = "border:1px solid var(--border-strong); background:var(--bg-canvas); margin:4px 0;";
            editArea.rows = 3;
            editArea.value = comment.body || "";
            editArea.addEventListener("keydown", e => {
              if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
                e.preventDefault();
                updateComment(issue, comment, editArea.value);
              } else if (e.key === "Escape") {
                e.preventDefault();
                e.stopPropagation();
                state.editingCommentId = null;
                renderDetailPane();
              }
            });

            const editFooter = document.createElement("div");
            editFooter.style.cssText = "display:flex; gap:6px; justify-content:flex-end; margin-top:4px;";
            const cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "btn-subtle";
            cancelBtn.textContent = "取消";
            cancelBtn.addEventListener("click", () => {
              state.editingCommentId = null;
              renderDetailPane();
            });
            const saveBtn = document.createElement("button");
            saveBtn.type = "button";
            saveBtn.className = "btn-blue";
            saveBtn.textContent = "儲存變更";
            saveBtn.addEventListener("click", () => updateComment(issue, comment, editArea.value));

            editFooter.append(cancelBtn, saveBtn);
            content.append(editArea, editFooter);
            setTimeout(() => {
              editArea.focus();
              editArea.setSelectionRange(editArea.value.length, editArea.value.length);
            }, 0);
          } else {
            const textEl = document.createElement("div");
            textEl.className = "comment-text";
            appendFormattedText(textEl, comment.body || "");
            content.appendChild(textEl);
          }

          item.append(avatar, content);
          commentListEl.appendChild(item);
        }
      }
    }

    function renderAll() {
      renderSidebar();
      renderPageHeader();
      renderDatabaseTable();
      renderDetailPane();
    }

    /* ================= Event Listeners ================= */
    // Sidebar Collapse (Desktop) & Off-Canvas Drawer (Mobile <= 768px)
    function isMobileViewport() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function openMobileSidebar() {
      document.body.classList.add("mobile-nav-open");
    }

    function closeMobileSidebar() {
      document.body.classList.remove("mobile-nav-open");
      if (state.sidebarEditing) {
        state.sidebarEditing = false;
        renderSidebar();
      }
    }

    function setComposerExpanded(expanded) {
      document.getElementById("quick-add-form").classList.toggle("expanded", expanded);
      document.body.classList.toggle("composer-open", expanded);
    }

    document.getElementById("sidebar-edit-btn").addEventListener("click", e => {
      e.stopPropagation();
      state.sidebarEditing = !state.sidebarEditing;
      renderSidebar();
    });

    const quickTaskInputEl = document.getElementById("new-task-input");
    quickTaskInputEl.addEventListener("focus", () => {
      setComposerExpanded(true);
    });
    quickTaskInputEl.addEventListener("input", () => {
      if (quickTaskInputEl.value.trim()) setComposerExpanded(true);
    });

    // Track iOS virtual keyboard height so floating bottom composer rides smoothly above keyboard
    if (window.visualViewport) {
      const syncViewportOffset = () => {
        if (!isMobileViewport()) {
          document.documentElement.style.setProperty("--vv-bottom", "0px");
          return;
        }
        const vv = window.visualViewport;
        const kbHeight = Math.max(0, Math.round(window.innerHeight - (vv.height + vv.offsetTop)));
        document.documentElement.style.setProperty("--vv-bottom", `${kbHeight}px`);
      };
      window.visualViewport.addEventListener("resize", syncViewportOffset);
      window.visualViewport.addEventListener("scroll", syncViewportOffset);
      window.addEventListener("resize", () => {
        syncViewportOffset();
        renderPageHeader();
      });
    }

    function setSidebarCollapsed(collapsed) {
      document.body.classList.toggle("sidebar-collapsed", collapsed);
      document.getElementById("open-sidebar-btn").style.display = collapsed ? "grid" : "none";
      localStorage.setItem("sidebar_collapsed", collapsed ? "1" : "0");
    }
    if (localStorage.getItem("sidebar_collapsed") === "1") setSidebarCollapsed(true);

    document.getElementById("close-sidebar-btn").addEventListener("click", () => {
      if (isMobileViewport()) {
        closeMobileSidebar();
      } else {
        setSidebarCollapsed(true);
      }
    });

    document.getElementById("open-sidebar-btn").addEventListener("click", () => {
      if (isMobileViewport()) {
        openMobileSidebar();
      } else {
        setSidebarCollapsed(false);
      }
    });

    document.getElementById("sidebar-backdrop").addEventListener("click", closeMobileSidebar);

    // Interactive Mobile Touch Swipe Gestures (Swipe Right -> Open Sidebar / Close Detail; Swipe Left -> Close Sidebar)
    (function initMobileSwipeGestures() {
      const sidebarEl = document.getElementById("sidebar");
      const backdropEl = document.getElementById("sidebar-backdrop");
      const detailEl = document.getElementById("detail-pane");
      let gesture = null;

      document.addEventListener("touchstart", e => {
        if (!isMobileViewport() || e.touches.length !== 1) {
          gesture = null;
          return;
        }
        if (
          popoverEl.classList.contains("open") ||
          confirmOverlayEl.classList.contains("open") ||
          authOverlayEl.classList.contains("open")
        ) {
          gesture = null;
          return;
        }

        const tag = (e.target.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea") {
          gesture = null;
          return;
        }

        const t = e.touches[0];
        const navOpen = document.body.classList.contains("mobile-nav-open");
        const peekOpen = Boolean(state.selectedIssueId && detailEl.classList.contains("open"));

        if (!navOpen && !peekOpen) {
          const hScroll = e.target.closest("#filter-tabs, #label-bar");
          if (hScroll && hScroll.scrollLeft > 2 && t.clientX > 28) {
            gesture = null;
            return;
          }
        }

        gesture = {
          mode: navOpen ? "close-nav" : (peekOpen ? "close-detail" : "open-nav"),
          startX: t.clientX,
          startY: t.clientY,
          lastX: t.clientX,
          startTime: Date.now(),
          axis: null,
          width: sidebarEl.offsetWidth || Math.min(300, Math.round(window.innerWidth * 0.84)),
          screenW: window.innerWidth || 390
        };
      }, { passive: true });

      document.addEventListener("touchmove", e => {
        if (!gesture || e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - gesture.startX;
        const dy = t.clientY - gesture.startY;
        gesture.lastX = t.clientX;

        if (!gesture.axis) {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
          const isHoriz = Math.abs(dx) > Math.abs(dy) * 1.25;
          if (gesture.mode === "open-nav" && isHoriz && dx > 0) {
            gesture.axis = "x";
            sidebarEl.style.transition = "none";
            backdropEl.style.transition = "none";
          } else if (gesture.mode === "close-nav" && isHoriz && dx < 0) {
            gesture.axis = "x";
            sidebarEl.style.transition = "none";
            backdropEl.style.transition = "none";
          } else if (gesture.mode === "close-detail" && isHoriz && dx > 0) {
            gesture.axis = "x";
            detailEl.style.transition = "none";
          } else {
            gesture.axis = "y";
            gesture = null;
            return;
          }
        }

        if (gesture.axis === "x") {
          if (e.cancelable) e.preventDefault();
          if (gesture.mode === "open-nav") {
            const w = gesture.width;
            const clamped = Math.max(0, Math.min(w, dx));
            const progress = clamped / w;
            sidebarEl.style.transform = `translateX(${clamped - w}px)`;
            sidebarEl.style.pointerEvents = "auto";
            backdropEl.style.opacity = String(progress);
          } else if (gesture.mode === "close-nav") {
            const w = gesture.width;
            const clamped = Math.max(-w, Math.min(0, dx));
            const progress = Math.max(0, 1 + clamped / w);
            sidebarEl.style.transform = `translateX(${clamped}px)`;
            backdropEl.style.opacity = String(progress);
          } else if (gesture.mode === "close-detail") {
            const clamped = Math.max(0, dx);
            detailEl.style.transform = `translateX(${clamped}px)`;
          }
        }
      }, { passive: false });

      const finishGesture = () => {
        if (!gesture) return;
        const g = gesture;
        gesture = null;
        if (g.axis !== "x") return;

        const dx = g.lastX - g.startX;
        const dt = Math.max(1, Date.now() - g.startTime);
        const vx = dx / dt;

        sidebarEl.style.transition = "";
        sidebarEl.style.transform = "";
        sidebarEl.style.pointerEvents = "";
        backdropEl.style.transition = "";
        backdropEl.style.opacity = "";
        detailEl.style.transition = "";
        detailEl.style.transform = "";

        if (g.mode === "open-nav") {
          if (dx > 54 || (dx > 22 && vx > 0.35)) {
            openMobileSidebar();
          } else {
            closeMobileSidebar();
          }
        } else if (g.mode === "close-nav") {
          if (dx < -54 || (dx < -22 && vx < -0.35)) {
            closeMobileSidebar();
          } else {
            openMobileSidebar();
          }
        } else if (g.mode === "close-detail") {
          if (dx > 72 || (dx > 28 && vx > 0.4)) {
            flushDetailEdits();
            state.selectedIssueId = null;
            renderAll();
          }
        }
      };

      document.addEventListener("touchend", finishGesture, { passive: true });
      document.addEventListener("touchcancel", finishGesture, { passive: true });
    })();

    document.getElementById("api-key-btn").addEventListener("click", () => {
      closeMobileSidebar();
      openAuthModal(Boolean(getApiKey()));
    });

    // Quick Composer
    document.getElementById("hero-label-badge").addEventListener("click", () => {
      if (!state.labelFilter) return;
      state.labelFilter = null;
      renderAll();
    });

    document.getElementById("quick-add-form").addEventListener("submit", e => {
      e.preventDefault();
      createIssue(document.getElementById("new-task-input").value);
    });

    document.getElementById("quick-type-btn").addEventListener("click", e => {
      e.stopPropagation();
      openPopover(
        e.currentTarget,
        "選擇項目類型 (Type)",
        TYPE_ITEMS.map(t => ({
          value: t.value,
          active: state.quickAddType === t.value,
          node: () => createTypePill(t.value, true, false)
        })),
        val => {
          state.quickAddType = val;
          renderPageHeader();
        }
      );
    });

    document.getElementById("quick-label-btn").addEventListener("click", e => {
      e.stopPropagation();
      openLabelPopover(e.currentTarget, { quickAdd: true });
    });

    document.getElementById("quick-prio-btn").addEventListener("click", e => {
      e.stopPropagation();
      openPopover(
        e.currentTarget,
        "選擇優先級",
        PRIORITY_ITEMS.map(p => ({
          value: p.value,
          active: state.quickAddPriority === p.value,
          node: () => createPriorityPill(p.value, false, false)
        })),
        val => {
          state.quickAddPriority = val;
          renderPageHeader();
        }
      );
    });

    document.getElementById("quick-proj-btn").addEventListener("click", e => {
      e.stopPropagation();
      openPopover(
        e.currentTarget,
        "新增到哪個專案",
        state.projects.map(p => ({
          value: p.id,
          active: state.quickAddProjectId === p.id,
          node: () => createProjectChipContent(p)
        })),
        val => {
          state.quickAddProjectId = val;
          const validIds = new Set(getScopedLabels(val).map(l => l.id));
          state.quickAddLabelIds = state.quickAddLabelIds.filter(id => validIds.has(id));
          renderPageHeader();
        }
      );
    });

    // View Tabs, Search, Sort
    document.querySelectorAll("#filter-tabs .view-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.statusFilter = tab.dataset.filter;
        localStorage.setItem("status_filter", state.statusFilter);
        renderAll();
      });
    });

    const searchWrap = document.getElementById("search-wrap");
    const searchInput = document.getElementById("search-input");
    document.getElementById("search-toggle-btn").addEventListener("click", () => {
      searchWrap.classList.toggle("open");
      if (searchWrap.classList.contains("open")) {
        searchInput.focus();
      } else {
        searchInput.value = "";
        state.searchQuery = "";
        renderAll();
      }
    });

    searchInput.addEventListener("input", e => {
      state.searchQuery = e.target.value;
      renderPageHeader();
      renderDatabaseTable();
    });

    document.getElementById("type-filter-btn").addEventListener("click", e => {
      e.stopPropagation();
      openPopover(
        e.currentTarget,
        "依 Type 篩選",
        [
          {
            value: "all",
            active: state.typeFilter === "all",
            node: () => {
              const s = document.createElement("span");
              s.textContent = "全部類型 (All)";
              return s;
            }
          },
          ...TYPE_ITEMS.map(t => ({
            value: t.value,
            active: state.typeFilter === t.value,
            node: () => createTypePill(t.value, true, false)
          }))
        ],
        val => {
          state.typeFilter = val;
          state.quickAddType = val === "all" ? "task" : val;
          renderAll();
        }
      );
    });

    document.getElementById("sort-menu-btn").addEventListener("click", e => {
      e.stopPropagation();
      openPopover(
        e.currentTarget,
        "排序方式",
        SORT_ITEMS.map(item => ({
          value: item.value,
          active: state.sortBy === item.value,
          node: () => {
            const s = document.createElement("span");
            s.textContent = item.label;
            return s;
          }
        })),
        val => {
          state.sortBy = val;
          localStorage.setItem("sort_by", val);
          renderAll();
        }
      );
    });

    document.getElementById("refresh-btn").addEventListener("click", loadData);
    document.getElementById("batch-delete-btn").addEventListener("click", deleteCheckedIssues);
    document.getElementById("select-mode-btn").addEventListener("click", () => {
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.checkedIssueIds.clear();
      renderDatabaseTable();
    });
    document.getElementById("select-all-btn").addEventListener("click", () => {
      const items = getFilteredAndSortedIssues();
      const allChecked = items.length > 0 && items.every(i => state.checkedIssueIds.has(i.id));
      if (allChecked) {
        items.forEach(i => state.checkedIssueIds.delete(i.id));
      } else {
        items.forEach(i => state.checkedIssueIds.add(i.id));
      }
      renderDatabaseTable();
    });

    // Detail Peek Events
    document.getElementById("detail-close-btn").addEventListener("click", () => {
      flushDetailEdits();
      state.selectedIssueId = null;
      renderAll();
    });

    document.getElementById("detail-delete-btn").addEventListener("click", () => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      if (issue) deleteIssue(issue);
    });

    document.getElementById("detail-title-input").addEventListener("blur", e => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      const val = e.target.value.trim();
      if (issue && val && val !== issue.title) {
        updateIssueFields(issue, { title: val }, "已更新標題");
      } else if (issue) {
        e.target.value = issue.title;
      }
    });

    document.getElementById("detail-title-input").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        e.target.blur();
      }
    });

    document.getElementById("detail-desc-input").addEventListener("input", e => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      state.descDirty = issue ? e.target.value !== (issue.description || "") : false;
      document.getElementById("save-desc-btn").style.display = state.descDirty ? "inline-block" : "none";
    });

    document.getElementById("detail-desc-input").addEventListener("blur", e => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      if (issue && state.descDirty) {
        updateIssueFields(issue, { description: e.target.value }, "已自動儲存說明");
      }
    });

    document.getElementById("detail-desc-input").addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        const issue = state.issues.find(i => i.id === state.selectedIssueId);
        if (issue && state.descDirty) {
          updateIssueFields(issue, { description: e.target.value }, "已儲存說明");
        }
      }
    });

    document.getElementById("save-desc-btn").addEventListener("click", () => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      if (issue) {
        updateIssueFields(issue, { description: document.getElementById("detail-desc-input").value }, "已儲存說明");
      }
    });

    document.getElementById("thread-sort-btn").addEventListener("click", () => {
      state.commentSortAsc = !state.commentSortAsc;
      renderDetailPane();
    });

    document.getElementById("add-comment-btn").addEventListener("click", () => {
      const issue = state.issues.find(i => i.id === state.selectedIssueId);
      if (issue) addComment(issue, document.getElementById("new-comment-input").value);
    });

    document.getElementById("new-comment-input").addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        const issue = state.issues.find(i => i.id === state.selectedIssueId);
        if (issue) addComment(issue, e.target.value);
      }
    });

    // New Project Drawer
    document.getElementById("toggle-new-project-btn").addEventListener("click", () => {
      const form = document.getElementById("new-project-form");
      form.classList.toggle("open");
      if (form.classList.contains("open")) {
        document.getElementById("new-project-name").focus();
      }
    });

    document.getElementById("cancel-project-btn").addEventListener("click", () => {
      document.getElementById("new-project-form").classList.remove("open");
    });

    document.getElementById("create-project-btn").addEventListener("click", () => {
      createProject(
        document.getElementById("new-project-name").value,
        document.getElementById("new-project-desc").value
      );
    });

    ["new-project-name", "new-project-desc"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          createProject(
            document.getElementById("new-project-name").value,
            document.getElementById("new-project-desc").value
          );
        } else if (e.key === "Escape") {
          e.preventDefault();
          e.stopPropagation();
          document.getElementById("new-project-form").classList.remove("open");
        }
      });
    });

    // Theme Toggle + iOS Status Bar Theme Color Sync
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

    function syncThemeMetaColor() {
      const current = document.documentElement.getAttribute("data-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = current ? current === "dark" : prefersDark;
      const meta = document.getElementById("meta-theme-color");
      if (meta) meta.setAttribute("content", isDark ? "#191919" : "#ffffff");
    }
    syncThemeMetaColor();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeMetaColor);

    document.getElementById("theme-btn").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = current ? current === "dark" : prefersDark;
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      syncThemeMetaColor();
    });

    // Auto-sync with Linear when returning to the app on iPhone / switching tabs
    function maybeAutoSyncOnResume() {
      if (document.visibilityState === "visible" && getApiKey() && Date.now() - lastSyncAt > 15000) {
        loadData();
      }
    }
    document.addEventListener("visibilitychange", maybeAutoSyncOnResume);
    window.addEventListener("focus", maybeAutoSyncOnResume);

    // Register PWA Service Worker for Home Screen app updates
    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    loadData();
  </script>
